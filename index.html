<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structured-LC</title>
<meta name="description" content="A focused place to study structured LeetCode solutions — patterns, tracks, companies, and your own lists.">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)">
<script src="config.js"></script>
<script>/* apply the saved theme before first paint, so there's no light→dark flash */
try{var _t=localStorage.getItem('slc_theme');if(_t)document.documentElement.setAttribute('data-theme',JSON.parse(_t));}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C7D6F'/%3E%3Crect x='8' y='9.6' width='16' height='2.9' rx='1.45' fill='white'/%3E%3Crect x='8' y='14.5' width='11' height='2.9' rx='1.45' fill='white' fill-opacity='0.85'/%3E%3Crect x='8' y='19.4' width='6.5' height='2.9' rx='1.45' fill='white' fill-opacity='0.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F0; --surface:#FFFFFF; --surface-2:#F3EEE4; --surface-3:#EAE3D5;
  --ink:#22201B; --ink-2:#6B6459; --ink-3:#857B68;
  --line:rgba(40,34,22,.10); --line-2:rgba(40,34,22,.06);
  --accent:#1C7D6F; --accent-ink:#13564c; --accent-soft:rgba(28,125,111,.10); --accent-soft-2:rgba(28,125,111,.18);
  --easy:#3C8C5A; --med:#B07A1E; --hard:#B4584A;
  --st-done:var(--accent); --st-learning:#B07A1E; --st-revisit:#6C63D6;
  --c-str:#4f8a46; --c-num:#b0761f; --c-kw:#8a5cc0; --c-fn:#3a6ea5; --c-const:#1C7D6F;
  --shadow:0 1px 2px rgba(40,34,22,.04),0 8px 24px rgba(40,34,22,.06);
  --shadow-lg:0 4px 12px rgba(40,34,22,.08),0 24px 48px rgba(40,34,22,.12);
  --sans:"Inter",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --reading:680px;
}
:root[data-theme="dark"]{
  --paper:#17150F; --surface:#211E17; --surface-2:#282419; --surface-3:#322D20;
  --ink:#ECE5D8; --ink-2:#A69D8C; --ink-3:#7C7363;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
  --accent:#53B9A9; --accent-ink:#8fd6ca; --accent-soft:rgba(83,185,169,.12); --accent-soft-2:rgba(83,185,169,.22);
  --easy:#6CBE88; --med:#D6A24F; --hard:#D77F6F;
  --st-done:var(--accent); --st-learning:#D6A24F; --st-revisit:#9A92F0;
  --c-str:#9cc27a; --c-num:#d9a95f; --c-kw:#bca0ee; --c-fn:#86b4e8; --c-const:#53B9A9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent-soft-2)}
/* visible keyboard focus everywhere (mouse clicks don't trigger :focus-visible) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.topbar a:focus-visible,.topbar button:focus-visible,.reader-bar a:focus-visible{outline-offset:-2px}
.palette input:focus-visible,.dlg-input:focus-visible,.acct-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#viewport{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---- shell / top bar ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--paper);background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;flex:none;padding:4px 2px}
.brand-word{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--ink);line-height:1}
.brand-dash{color:var(--accent)}
.search-pill{flex:1;min-width:0;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:9px;
  height:38px;padding:0 14px;border-radius:11px;background:var(--surface-2);color:var(--ink-3);
  border:1px solid transparent;transition:.15s;font-size:14px}
.search-pill>span:not(.kbd){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-pill:hover{background:var(--surface-3);color:var(--ink-2)}
.search-pill svg{width:16px;height:16px}
.search-pill .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 6px;
  border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.avatar-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);transition:.15s;margin-left:2px}
.avatar-btn:hover{color:var(--ink);border-color:var(--accent-soft-2)}
.avatar-btn svg{width:19px;height:19px}

.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:1080px;margin:0 auto;padding:34px 28px 90px}

/* ---- home ---- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;
  display:flex;align-items:baseline;gap:10px}
.section:not(.expanded) .tile.overflow{display:none}
.more-tile{align-items:center;justify-content:center;text-align:center;border-style:dashed}
.more-tile .dots{font-size:30px;line-height:.5;letter-spacing:3px;color:var(--ink-3);margin-bottom:12px}
.more-tile .more-label{font-size:13.5px;font-weight:600;color:var(--accent)}
.more-tile:hover{border-color:var(--accent-soft-2)}
.more-tile:hover .dots{color:var(--accent)}
.section{margin-bottom:38px}
.greet{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
.site-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line-2);text-align:center;
  color:var(--ink-3);font-size:11px;line-height:1.65;opacity:.7}
.site-foot .ver{font-family:var(--mono);font-size:10px}
.site-foot .heart{color:var(--hard);opacity:.85}

/* hero pair: Continue + Study */
.hero-row{display:grid;grid-template-columns:1.9fr 1fr;gap:16px;margin-bottom:38px}
@media(max-width:720px){.hero-row{grid-template-columns:1fr}}
.continue{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:18px;
  background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.continue:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ring{--p:41;width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0)}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-weight:700;font-size:13px}
.continue .meta{flex:1;min-width:0}
.continue .k{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.continue .t{font-family:var(--serif);font-size:20px;font-weight:600;margin:3px 0 2px}
.continue .d{color:var(--ink-2);font-size:14px}
.continue .go{flex:none;display:flex;align-items:center;gap:7px;font-weight:600;color:var(--accent)}
.continue .go svg{width:18px;height:18px}
.hero-study{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:22px 24px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.hero-study:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hero-study .hs-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;margin-bottom:10px}
.hero-study .hs-ic svg{width:21px;height:21px}
.hero-study .t{font-family:var(--serif);font-size:19px;font-weight:600}
.hero-study .d{color:var(--ink-2);font-size:13.5px}
.hero-study .go{margin-top:8px;display:flex;align-items:center;gap:7px;font-weight:600;color:var(--accent);font-size:14px}
.hero-study .go svg{width:17px;height:17px}

/* first-run welcome (dismissible, shown until the user starts or dismisses) */
.welcome{position:relative;margin-bottom:30px;padding:24px 26px;border-radius:18px;
  background:linear-gradient(135deg,var(--accent-soft),transparent 72%),var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.welcome .wx{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;border:none;
  background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;transition:.15s}
.welcome .wx:hover{background:var(--surface-3);color:var(--ink)}
.welcome .wx svg{width:17px;height:17px}
.welcome .eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.welcome .wh{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px;padding-right:34px}
.welcome .wsub{color:var(--ink-2);font-size:14px;margin-bottom:18px;max-width:62ch}
.welcome .wsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
@media(max-width:620px){.welcome .wsteps{grid-template-columns:1fr}}
.welcome .wstep{display:flex;gap:12px;align-items:flex-start}
.welcome .wstep .si{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.welcome .wstep .si svg{width:18px;height:18px}
.welcome .wstep .st{font-weight:600;font-size:14px}
.welcome .wstep .sd{color:var(--ink-2);font-size:13px;line-height:1.5}
.welcome .wstart{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;border:none;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.welcome .wstart:hover{filter:brightness(1.05);transform:translateY(-1px)}
.welcome .wstart svg{width:16px;height:16px}

/* unified tile grid (patterns / tracks / lists) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px}
.tile{position:relative;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  cursor:pointer;transition:.16s;overflow:hidden;min-height:132px;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent-soft-2)}
.tile .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:12px}
.tile .ic svg{width:19px;height:19px}
.tile .nm{font-family:var(--serif);font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.2}
.tile .ds{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.tile .ct{margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .ct b{color:var(--ink);font-weight:600}
.tile .tbar{margin-top:auto;padding-top:12px}
.tile .tbar .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:8px}
.tile .tbar .lbl b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:11px;font-weight:600;font-size:14px;
  background:var(--accent);color:#fff;transition:.15s;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-3)}

/* ---- list view ---- */
.lv-head{margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13.5px;font-weight:500;margin-bottom:16px;transition:.15s}
.back:hover{color:var(--accent)}
.back svg{width:16px;height:16px}
.lv-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.02em}
.lv-sub{color:var(--ink-2);margin-top:5px;font-size:14.5px}
.sub-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px}
.plist{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.prow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.12s}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--surface-2)}
.prow .num{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);width:46px;flex:none}
.prow .ti{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.Easy{background:var(--easy)}.dot.Medium{background:var(--med)}.dot.Hard{background:var(--hard)}
.dlabel{font-size:12px;font-weight:600;width:62px;flex:none;text-align:right}
.dlabel.Easy{color:var(--easy)}.dlabel.Medium{color:var(--med)}.dlabel.Hard{color:var(--hard)}

/* ---- reader ---- */
.reader-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;
  background:var(--paper);background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(14px) saturate(1.6);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);border-bottom:1px solid var(--line-2)}
/* left: back arrow + breadcrumb = the "go back" target */
.reader-bar .crumb-back{flex:none;z-index:1}
.reader-bar .crumb{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.reader-bar .crumb .ctx{color:var(--ink-2)}
.reader-bar .crumb .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
/* center: problem title, revealed once the page heading scrolls under the bar */
.reader-bar .rbar-title{position:absolute;left:50%;transform:translateX(-50%);max-width:54%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;pointer-events:none;
  font-family:var(--serif);font-weight:600;font-size:15.5px;letter-spacing:-.01em;color:var(--ink);
  opacity:0;transition:opacity .22s ease}
.reader-bar .rbar-title.show{opacity:1}
.reader-bar .rbar-title .rbar-num{font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--ink-3);margin-right:7px}
.reader-bar .rb{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:13px;
  font-weight:500;color:var(--ink-2);transition:.15s}
.reader-bar .rb:hover{background:var(--surface-2);color:var(--ink)}
.reader-bar .rb svg{width:16px;height:16px}
.reader-bar .rb.on{background:var(--accent-soft);color:var(--accent)}

.reader-scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.reader{max-width:var(--reading);margin:0 auto;padding:44px 28px 120px}
.r-diff{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;margin-bottom:16px}
.r-diff.Easy{background:color-mix(in srgb,var(--easy) 14%,transparent);color:var(--easy)}
.r-diff.Medium{background:color-mix(in srgb,var(--med) 15%,transparent);color:var(--med)}
.r-diff.Hard{background:color-mix(in srgb,var(--hard) 15%,transparent);color:var(--hard)}
.r-title{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
.chip{font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);transition:.14s}
a.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip.practice{background:var(--accent);color:#fff}
.chip.practice:hover{filter:brightness(1.07)}
/* meta row: tags + action pills flow together; colour sets the actions apart */
.r-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
/* action pills — chip-sized, but colour-highlighted so they read as actions, not tags */
.r-action{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  border:1px solid var(--accent-soft-2);background:var(--surface);color:var(--ink);cursor:pointer;transition:.14s}
.r-action:hover{background:var(--surface-2);border-color:var(--accent)}
.r-action svg{width:14px;height:14px}
.r-action .act-chev{opacity:.5;margin-left:-1px}
.r-action .act-chev svg{width:12px;height:12px}
.status-act>svg:first-child,.list-act>svg:first-child{color:var(--accent)}
.status-act.learning{color:var(--st-learning);border-color:color-mix(in srgb,var(--st-learning) 48%,transparent);background:color-mix(in srgb,var(--st-learning) 11%,transparent)}
.status-act.learning>svg:first-child{color:var(--st-learning)}
.status-act.revisit{color:var(--st-revisit);border-color:color-mix(in srgb,var(--st-revisit) 48%,transparent);background:color-mix(in srgb,var(--st-revisit) 11%,transparent)}
.status-act.revisit>svg:first-child{color:var(--st-revisit)}
.status-act.done{color:var(--st-done);border-color:color-mix(in srgb,var(--accent) 48%,transparent);background:var(--accent-soft)}
.status-act.done>svg:first-child{color:var(--st-done)}
.list-act.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 48%,transparent);background:var(--accent-soft)}
.practice-act{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.practice-act:hover{filter:brightness(1.07);background:var(--accent);border-color:transparent}
.practice-act svg{width:12px;height:12px}
.hr{height:1px;background:var(--line);margin:22px 0}

/* reading-progress line, pinned under the reader bar */
.read-progress{position:sticky;top:0;height:2px;z-index:18;background:transparent}
.read-progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 2px 2px 0}
/* floating hint (the flashcard, revealed on demand) — inline on mobile, floated right on desktop */
.hint{margin:10px 0 2px}
.hint-toggle{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  border:1px dashed var(--accent-soft-2);background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;transition:.15s}
.hint-toggle:hover{background:var(--accent-soft-2)}
.hint-toggle svg{width:16px;height:16px}
.hint-body{margin-top:10px;background:linear-gradient(135deg,var(--accent-soft),transparent 82%),var(--surface);
  border:1px solid var(--accent-soft-2);border-radius:16px;padding:16px 18px;animation:pop .14s ease}
.hint-body .fl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hint-body p{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--ink);margin:0;line-height:1.5}
@media(min-width:1240px){
  .hint{position:fixed;top:118px;right:28px;width:224px;margin:0;z-index:15}
  .hint-toggle{width:100%;justify-content:center}
}

/* markdown prose */
.prose{font-family:var(--serif);font-size:18px;line-height:1.62;color:var(--ink)}
.prose.compact{font-size:17px}
.sec{margin:30px 0;scroll-margin-top:14px}
.sec > h3{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.sec > h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
.prose p{margin:0 0 14px}
.prose strong{font-weight:600}
.prose em{font-style:italic;color:var(--ink-2)}
.prose ul{margin:0 0 14px;padding-left:22px}
.prose li{margin:5px 0}
.prose h4{font-family:var(--sans);font-size:15px;font-weight:600;margin:18px 0 8px}
.prose blockquote{border-left:3px solid var(--accent-soft-2);padding:2px 0 2px 16px;margin:0 0 14px;color:var(--ink-2);font-style:italic}
.prose code{font-family:var(--mono);font-size:.82em;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--accent-ink)}
.prose pre.code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;overflow-x:auto;margin:0 0 16px;line-height:1.55}
.prose pre.code code{font-family:var(--mono);background:none;padding:0;font-size:13.5px;color:var(--ink);border-radius:0}
.prose pre.code .tk-com{color:var(--ink-3);font-style:italic}
.prose pre.code .tk-str{color:var(--c-str)}
.prose pre.code .tk-num{color:var(--c-num)}
.prose pre.code .tk-kw{color:var(--c-kw);font-weight:500}
.prose pre.code .tk-const{color:var(--c-const)}
.prose pre.code .tk-builtin,.prose pre.code .tk-fn{color:var(--c-fn)}
.prose pre.code .tk-self{color:var(--c-const);font-style:italic}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 18px}

/* spoiler */
.spoiler{position:relative;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;background:var(--surface-2)}
.spoiler .lab{font-family:var(--sans);font-size:14px;color:var(--ink-2);margin-bottom:14px}
.flash{background:linear-gradient(135deg,var(--accent-soft),transparent 80%),var(--surface);
  border:1px solid var(--accent-soft-2);border-radius:16px;padding:22px 24px;margin:14px 0}
.flash .fl{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.flash p{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink);margin:0}

.rnav{display:flex;gap:12px;margin-top:40px}
.rnav button{flex:1;display:flex;flex-direction:column;gap:3px;padding:16px 20px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);transition:.16s;text-align:left}
.rnav button:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent-soft-2)}
.rnav button:disabled{opacity:.4;cursor:default}
.rnav button.next{text-align:right;align-items:flex-end}
.rnav .lb{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rnav .vl{font-family:var(--serif);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* zen */
body.zen .reader-bar{background:transparent;border-color:transparent;backdrop-filter:none}
body.zen .reader-bar .crumb,body.zen .reader-bar .rbar-title{opacity:0;pointer-events:none}
body.zen .hint{display:none}
body.zen .reader{--reading:640px}

/* search overlay */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(20,16,8,.4);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.overlay.open{display:flex}
.palette{width:min(600px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden}
.palette .inp{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.palette .inp svg{width:20px;height:20px;color:var(--ink-3)}
.palette input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:17px;color:var(--ink)}
.palette .results{max-height:52vh;overflow-y:auto;padding:8px}
.palette .res{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:10px;cursor:pointer}
.palette .res:hover,.palette .res.sel{background:var(--surface-2)}
.palette .res .num{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:42px}
.palette .res .ti{flex:1;font-weight:500}
.palette .empty{padding:30px;text-align:center;color:var(--ink-3);font-size:14px}
.palette .res-group{padding:12px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.palette .res .res-ic{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:14px}
.palette .res .res-ic svg{width:16px;height:16px}
.palette .res .res-sub{margin-left:auto;font-size:12px;color:var(--ink-3)}
.boot,.rloading{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.rloading svg{width:18px;height:18px;opacity:.6}
.boot code{font-family:var(--mono);background:var(--surface-2);padding:2px 6px;border-radius:5px}

/* study mode */
.study-wrap{max-width:560px;margin:0 auto;padding:50px 28px;text-align:center}
.card3d{perspective:1400px;margin:24px 0}
.card-inner{position:relative;min-height:280px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.card-inner.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px}
.face .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.face .q{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--accent-soft),transparent 80%),var(--surface)}
.face.back .a{font-family:var(--serif);font-size:19px;font-style:italic;line-height:1.5}
.study-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px;color:var(--ink-2)}
.study-nav .ct{font-family:var(--mono);font-size:13px}
.study-hint{font-size:13px;color:var(--ink-3);margin-top:18px}
.study-note{font-size:13.5px;color:var(--ink-2);line-height:1.5;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin-bottom:6px;text-align:left}
.deck-badge{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.deck-badge.done{background:var(--accent-soft);color:var(--accent)}
.deck-badge.revisit{background:color-mix(in srgb,var(--st-revisit) 14%,transparent);color:var(--st-revisit)}
.deck-badge.learning{background:color-mix(in srgb,var(--st-learning) 14%,transparent);color:var(--st-learning)}

/* status control */
.status-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;transition:.14s}
.status-btn svg{width:17px;height:17px}
.status-btn:hover{background:var(--surface-3)}
.status-btn.todo{color:var(--ink-3);opacity:.3}
.prow:hover .status-btn.todo{opacity:.7}
.status-btn.learning{color:var(--st-learning)}
.status-btn.revisit{color:var(--st-revisit)}
.status-btn.done{color:var(--st-done)}
.status-menu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;min-width:172px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1}}
.status-menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--ink);text-align:left}
.status-menu button:hover{background:var(--surface-2)}
.status-menu button svg{width:16px;height:16px}
.status-menu button .ck{margin-left:auto;color:var(--accent)}
.status-menu .todo svg{color:var(--ink-3)} .status-menu .learning svg{color:var(--st-learning)}
.status-menu .revisit svg{color:var(--st-revisit)} .status-menu .done svg{color:var(--st-done)}
.scount{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.scount .d{width:7px;height:7px;border-radius:50%}
.scount.done .d{background:var(--st-done)} .scount.learning .d{background:var(--st-learning)} .scount.revisit .d{background:var(--st-revisit)}
.hgroup{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* custom lists */
.status-menu.list-menu button svg{width:16px;height:16px}
.status-menu .newrow{border-top:1px solid var(--line-2);margin-top:4px;padding-top:11px;color:var(--accent);font-weight:600}
.status-menu .newrow svg{color:var(--accent)}
.status-menu .menu-empty{padding:10px 11px;color:var(--ink-3);font-size:13px}
.status-menu button.in svg{color:var(--accent)}
.tile .ic.dashed{background:transparent;border:1.5px dashed var(--line);color:var(--ink-3)}
.tile.newlist{border-style:dashed}
.tile.newlist:hover .ic.dashed{border-color:var(--accent);color:var(--accent)}
.lv-headrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.list-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{color:var(--hard)}
.btn.danger:hover{background:color-mix(in srgb,var(--hard) 12%,transparent)}
.btn-danger{background:var(--hard)}
.row-x{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);flex:none;transition:.14s}
.row-x svg{width:15px;height:15px}
.row-x:hover{background:color-mix(in srgb,var(--hard) 14%,transparent);color:var(--hard)}
.empty-list{text-align:center;padding:48px 24px;color:var(--ink-3)}
.empty-list svg{width:30px;height:30px;opacity:.55}
.empty-list p{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin:12px 0 6px}
.empty-list span{font-size:13.5px}
.addmark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line);flex:none}
.addmark svg{width:15px;height:15px}
.addmark.on{background:var(--accent);color:#fff;border-color:transparent}
.overlay.add-mode .palette .inp svg{color:var(--accent)}
.res.added .ti{color:var(--accent)}
/* modal dialog */
.modal-ov{align-items:center;padding-top:0}
.dialog{width:min(420px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:22px 22px 18px;animation:pop .14s ease}
.dlg-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
.dlg-msg{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:16px}
.dlg-input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;margin-bottom:16px}
.dlg-input:focus{border-color:var(--accent)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}

/* feedback */
.fb-dialog{width:min(480px,94vw);text-align:left}
.fb-types{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 14px}
.fb-type{display:inline-flex;align-items:center;gap:4px;padding:5px 7px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;transition:.14s}
.fb-type:hover{border-color:var(--accent-soft-2)}
.fb-type.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 48%,transparent)}
.fb-msg{width:100%;min-height:112px;resize:vertical;font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;line-height:1.5}
.fb-msg:focus{border-color:var(--accent)}
.fb-ctx-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.fb-ctx{display:flex;flex-wrap:wrap;gap:7px}
.fb-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 6px 5px 11px;border-radius:999px;font-size:12px;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.fb-chip .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.fb-chip button:hover{background:color-mix(in srgb,var(--hard) 15%,transparent);color:var(--hard)}
.fb-chip button svg{width:11px;height:11px}
.fb-hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
.fb-note{font-size:11.5px;color:var(--ink-3);margin:12px 0 2px;line-height:1.45}
/* reader "report an issue" footer link */
.r-report{margin-top:34px;text-align:center}
.r-report-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);transition:.14s}
.r-report-link:hover{color:var(--accent)}
.r-report-link svg{width:15px;height:15px}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);z-index:90;
  background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:12px;
  box-shadow:var(--shadow-lg);opacity:0;transition:.2s ease;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--hard);color:#fff}
@media(max-width:760px){.toast{bottom:78px}}

/* account menu */
.account-menu{min-width:244px;padding:0;overflow:hidden}
.acct-head{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line-2)}
.acct-av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.acct-av svg{width:21px;height:21px}
.acct-id{min-width:0}
.acct-name{font-family:var(--serif);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-sub{font-size:12px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-menu .acct-body{padding:6px}
.account-menu .acct-body button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink);text-align:left}
.account-menu .acct-body button:hover{background:var(--surface-2)}
.account-menu .acct-body button svg{width:17px;height:17px;color:var(--ink-2)}
.acct-note{padding:10px 16px 14px;font-size:11.5px;color:var(--ink-3);line-height:1.4;border-top:1px solid var(--line-2)}
.acct-auth{padding:12px 14px}
.acct-auth form{display:flex;flex-direction:column;gap:8px}
.acct-input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.acct-input:focus{border-color:var(--accent)}
.acct-auth .btn{width:100%;justify-content:center}
.avatar-btn.signed-in{background:var(--accent);border-color:transparent;color:#fff}
.avatar-btn .av-initial{font-weight:700;font-size:14px;font-family:var(--sans)}

/* mobile */
.tabbar{display:none}
@media(max-width:760px){
  .main{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .wrap{padding:22px 18px 40px}
  .reader{padding:28px 18px 90px}
  .r-title{font-size:27px}
  .greet{font-size:23px}
  .prose{font-size:17px}
  .topbar{padding:0 14px;gap:10px}
  .reader-bar{padding:0 16px}
  .reader-bar .crumb .ctx{display:none}
  .brand-word{font-size:19px}
  .search-pill{max-width:none}
  .search-pill .kbd{display:none}
  .top-actions{gap:2px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);z-index:45;
    background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px) saturate(1.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-3);font-size:10.5px;font-weight:500;transition:.15s}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.active{color:var(--accent)}
  body.zen .tabbar{transform:translateY(100%)}
}
.hidden{display:none!important}
</style>
</head>

/* ==========================================================================

/* ==========================================================================
   CRDT-lite state — every item carries a timestamp, deletions are tombstones.
   This makes state MERGEABLE (commutative, idempotent) so two devices / tabs /
   an offline edit never clobber each other: the newest change per item wins,
   and a delete beats a stale presence (no resurrection). Shared by store + sync.
   Shape: { status:{n:val}, statusAt:{n:ts}, lists:[CRDTList], last:{...,at}, theme, themeAt }
          CRDTList = { id, name, nameAt, created, deletedAt, items:{n:{at,in}} }
          theme is a last-writer-wins scalar (themeAt is its timestamp).
   ========================================================================== */
let _clk=0; const nowTs=()=>{ _clk=Math.max(Date.now(), _clk+1); return _clk; };   // monotonic within a tab
function normState(s){
  s=s||{};
  const status={...(s.status||{})}, statusAt={...(s.statusAt||{})};
  const lists=(s.lists||[]).map(l=>{
    if(l && l.items) return { id:l.id, name:l.name, nameAt:l.nameAt||l.created||0, created:l.created||0, deletedAt:l.deletedAt||0, items:{...l.items} };
    const items={}; (l.problems||[]).forEach(n=>items[Number(n)]={at:l.created||1, in:true});   // upgrade old shape
    return { id:l.id, name:l.name, nameAt:l.created||0, created:l.created||0, deletedAt:0, items };
  });
  return { status, statusAt, lists, last:s.last||null, theme:s.theme||null, themeAt:s.themeAt||0 };
}
function mergeList(x,y){
  const name=(x.nameAt||0)>=(y.nameAt||0)?x.name:y.name;
  const items={}; const ks=new Set([...Object.keys(x.items||{}),...Object.keys(y.items||{})]);
  for(const n of ks){ const xi=x.items[n], yi=y.items[n];
    items[n]=(!yi||(xi&&(xi.at||0)>=(yi.at||0)))?xi:yi; }
  const created=Math.min(x.created||Infinity,y.created||Infinity);
  return { id:x.id, name, nameAt:Math.max(x.nameAt||0,y.nameAt||0), created:created===Infinity?0:created,
           deletedAt:Math.max(x.deletedAt||0,y.deletedAt||0), items };
}
function mergeState(a,b){
  a=normState(a); b=normState(b);
  const status={}, statusAt={};
  const sk=new Set([...Object.keys(a.statusAt),...Object.keys(b.statusAt),...Object.keys(a.status),...Object.keys(b.status)]);
  for(const n of sk){ const aa=a.statusAt[n]||0, ba=b.statusAt[n]||0, win=aa>=ba?a:b, at=Math.max(aa,ba);
    if(at) statusAt[n]=at; if(win.status[n]!=null) status[n]=win.status[n]; }     // clear (tombstone) can win over a stale set
  const byId={}; const add=l=>{ byId[l.id]=byId[l.id]?mergeList(byId[l.id],l):{...l,items:{...l.items}}; };
  a.lists.forEach(add); b.lists.forEach(add);
  const last=(a.last&&b.last)?((a.last.at||0)>=(b.last.at||0)?a.last:b.last):(a.last||b.last);
  const theme=(a.themeAt||0)>=(b.themeAt||0)?a.theme:b.theme;   // last-writer-wins scalar
  const themeAt=Math.max(a.themeAt||0,b.themeAt||0);
  return { status, statusAt, lists:Object.values(byId), last, theme, themeAt };
}

const store = (() => {
  const K = { status:'slc_status', at:'slc_status_at', last:'slc_last', theme:'slc_theme', themeAt:'slc_theme_at', lists:'slc_lists' };
  const readLS = () => normState({ status:LS.get(K.status,{}), statusAt:LS.get(K.at,{}), lists:LS.get(K.lists,[]),
    last:LS.get(K.last,null), theme:LS.get(K.theme,null), themeAt:LS.get(K.themeAt,0) });
  let S = readLS();
  const uid = () => 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  let onChange=null; const changed=()=>{ if(onChange) try{ onChange(); }catch(e){} };
  const persist=()=>{ LS.set(K.status,S.status); LS.set(K.at,S.statusAt); LS.set(K.lists,S.lists); LS.set(K.last,S.last);
    LS.set(K.theme,S.theme); LS.set(K.themeAt,S.themeAt); };
  const rawList=id=>S.lists.find(l=>l.id===id);
  const members=l=>Object.keys(l.items).filter(n=>l.items[n].in).map(Number);
  const view=l=>({ id:l.id, name:l.name, problems:members(l), created:l.created });   // simple shape the UI uses
  const liveLists=()=>S.lists.filter(l=>!l.deletedAt).sort((a,b)=>(a.created||0)-(b.created||0));
  return {
    getStatus:n => S.status[n] || null,
    setStatus:(n,s) => { if(s){ S.status[n]=s; } else { delete S.status[n]; } S.statusAt[n]=nowTs();   // keep statusAt (tombstone)
      persist(); changed(); },
    reviewQueue:() => Object.keys(S.status).filter(n=>S.status[n]==='done'||S.status[n]==='revisit')
      .sort((a,b)=>(S.statusAt[b]||0)-(S.statusAt[a]||0)).map(Number),
    countDone:list => list.reduce((a,p)=>a+(S.status[(p.number??p)]==='done'?1:0),0),
    counts:list => { const c={learning:0,revisit:0,done:0};
      list.forEach(p=>{ const s=S.status[(p.number??p)]; if(c[s]!=null)c[s]++; }); return c; },
    getLast:() => S.last,
    setLast:o => { S.last={...o, at:nowTs()}; LS.set(K.last,S.last); },   // not pushed per nav; flushed on page-hide if it moved
    getTheme:() => S.theme,
    setTheme:t => { S.theme=t; S.themeAt=nowTs(); persist(); changed(); },   // timestamped so it syncs (last-writer-wins)
    // --- custom lists (CRDT internally; simple shape out) -------------------
    getLists:() => liveLists().map(view),
    getList:id => { const l=rawList(id); return (l&&!l.deletedAt)?view(l):undefined; },
    createList:name => { const id=uid(); S.lists.push({id,name:(name||'Untitled').slice(0,60),nameAt:nowTs(),created:nowTs(),deletedAt:0,items:{}}); persist(); changed(); return id; },
    renameList:(id,name) => { const l=rawList(id); if(l&&name){ l.name=name.slice(0,60); l.nameAt=nowTs(); persist(); changed(); } },
    deleteList:id => { const l=rawList(id); if(l){ l.deletedAt=nowTs(); persist(); changed(); } },
    toggleInList:(id,num) => { const l=rawList(id); if(!l)return false; num=Number(num);
      const on=!(l.items[num] && l.items[num].in); l.items[num]={at:nowTs(), in:on}; persist(); changed(); return on; },
    inList:(id,num) => { const l=rawList(id); return !!l && !l.deletedAt && !!(l.items[Number(num)] && l.items[Number(num)].in); },
    listCountFor:num => liveLists().reduce((a,l)=>a+((l.items[Number(num)]&&l.items[Number(num)].in)?1:0),0),
    // --- cloud sync surface (used by the auth module) ----------------------
    subscribe:fn => { onChange=fn; },
    reload:() => { S = readLS(); },                           // re-read LS (cross-tab)
    exportLocal:() => ({ status:S.status, statusAt:S.statusAt, lists:S.lists, last:S.last, theme:S.theme, themeAt:S.themeAt }),
    importState:s => { S = normState(s); persist(); },        // adopt a snapshot (already-merged)
    clearLocal:() => { S = normState({ theme:S.theme, themeAt:S.themeAt }); persist(); },  // wipe account data on sign-out, keep the device's theme
  };
})();

/* ==========================================================================
   AUTH + CLOUD SYNC — optional, gated by site/config.js (Supabase).
   Runs local-only (no-op) until SUPABASE_URL/ANON_KEY are set. The whole app
   reads/writes through `store`; this layer just mirrors store <-> a single
   per-user JSON row, merging on login so anonymous progress is never lost.
   ========================================================================== */
const auth = (() => {
  const cfg = (window.SLC_CONFIG||{});
  const enabled = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
  let sb=null, user=null, pushTimer=null, lastSig=null, ready=false, rtChannel=null, profileName=null;  // ready = a successful reconcile has run
  // lastSig = the resume pointer we last synced (by hash, so re-opening the same problem isn't "moved")
  const curLastSig = () => { const l=store.getLast(); return l?l.hash:null; };

  // a nice, stable, unique-ish username derived from the account id (no storage needed)
  const ADJ=['Swift','Quiet','Lucid','Amber','Cobalt','Bright','Clever','Brave','Calm','Noble','Mellow','Crisp','Keen','Vivid','Sage','Lunar','Solar','Golden','Azure','Rapid','Gentle','Bold','Nimble','Sunny'];
  const NOUN=['Falcon','Harbor','Cedar','Comet','Maple','Otter','Quartz','Raven','Willow','Heron','Cipher','Vector','Lynx','Ember','Delta','Finch','Birch','Onyx','Wren','Koi','Pine','Aspen','Sable','Orca'];
  function makeUsername(seed){ let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
    return ADJ[h%ADJ.length]+NOUN[(Math.floor(h/ADJ.length))%NOUN.length]+((h>>>8)%90+10); }
  const USERNAME_RE = /^[A-Za-z0-9_-]{2,24}$/;
  // Load this account's stored username, or assign a unique one on first sign-in.
  async function ensureProfile(){
    const c=await client();
    const got = await c.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
    if(got.data){ profileName=got.data.username; cacheName(profileName); return; }
    for(let i=0;i<10;i++){
      const name = i===0 ? makeUsername(user.id) : makeUsername(user.id)+(1000+Math.floor(Math.random()*9000));
      const { error } = await c.from('profiles').insert({ user_id:user.id, username:name });
      if(!error){ profileName=name; cacheName(profileName); return; }
      if(error.code==='23505'){                         // conflict: our row already exists, or the handle is taken
        const mine = await c.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
        if(mine.data){ profileName=mine.data.username; cacheName(profileName); return; }
        continue;                                        // handle taken by someone else → try another
      }
      throw error;
    }
  }
  async function setUsername(name){
    name=(name||'').trim();
    if(!USERNAME_RE.test(name)) return { error:{ message:'Use 2–24 letters, numbers, - or _.' } };
    const c=await client();
    const { error } = await c.from('profiles').upsert({ user_id:user.id, username:name });
    if(error) return { error:{ message: error.code==='23505' ? 'That username is already taken.' : error.message } };
    profileName=name; cacheName(name); return {};
  }
  // re-fetch the username from the DB (picks up a rename made on another device)
  async function refreshProfile(){
    if(!user || !ready) return;
    try{ const c=await client();
      const { data } = await c.from('profiles').select('username').eq('user_id', user.id).maybeSingle();
      if(data && data.username!==profileName){ profileName=data.username; cacheName(profileName);
        if(typeof render==='function') render(); if(typeof refreshAccountMenu==='function') refreshAccountMenu(); }
    }catch(e){}
  }

  async function client(){
    if(sb) return sb;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.118.0');
    sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    return sb;
  }
  /* ---- sync bookkeeping (localStorage) ----
     syncedUser : the account id this device is reconciled with (null = anonymous / signed out)
     syncedAt   : the remote `updated_at` we last adopted/wrote
     dirty      : local has changes not yet pushed  */
  const SK = { syncedUser:'slc_sync_user', syncedAt:'slc_sync_at', dirty:'slc_dirty', username:'slc_username' };
  const cacheName = n => LS.set(SK.username, n||null);           // persist username so reloads show it instantly
  const cachedName = () => LS.get(SK.username, null);
  // stored name if loaded, else the cached one (instant on reload), else the derived default
  // Only ever surface a REAL name: the one loaded from the DB, or the last-known
  // one cached on this device (instant on reload). Never fabricate via
  // makeUsername — that guess is wrong for anyone who customized their handle and
  // caused past names to flash between sign-out and the profile re-loading.
  const displayName = () => profileName || cachedName() || null;
  const isDirty  = () => !!LS.get(SK.dirty,0);
  const markDirty= () => LS.set(SK.dirty,1);
  const stamp    = (uid,at) => { LS.set(SK.syncedUser,uid); LS.set(SK.syncedAt,at||null); LS.set(SK.dirty,0); lastSig=curLastSig(); };
  const clearSync= () => { LS.set(SK.syncedUser,null); LS.set(SK.syncedAt,null); LS.set(SK.dirty,0); cacheName(null); };

  async function pull(){ const c=await client();
    const { data } = await c.from('user_state').select('state,updated_at').eq('user_id', user.id).maybeSingle();
    return data || null; }                                  // { state, updated_at } | null
  const hasData = st => st && (Object.keys(st.status||{}).length>0 || (st.lists||[]).length>0);

  // READ-MERGE-WRITE with optimistic concurrency:
  //  • cheap path — conditionally UPDATE only if the row is still at our last-known
  //    `updated_at` (compare-and-set). If it still matches, nobody else wrote → our
  //    local (already merged) is authoritative.
  //  • on a precondition miss (another device/tab wrote in between) → pull, MERGE
  //    the remote into local (CRDT: newest-per-item wins, tombstones beat stale
  //    presence), reflect it, and retry. So nothing is ever clobbered or lost.
  async function syncPush(){
    const c=await client(); let base = LS.get(SK.syncedAt, null); let mergedIn=false;
    for(let tries=0; tries<6; tries++){
      const payload = store.exportLocal();
      if(base!=null){
        const { data, error } = await c.from('user_state').update({ state:payload })
          .eq('user_id', user.id).eq('updated_at', base).select('updated_at').maybeSingle();
        if(error) throw error;
        if(data){ stamp(user.id, data.updated_at); if(mergedIn && typeof render==='function') render(); return; }
      } else {
        const { data, error } = await c.from('user_state').insert({ user_id:user.id, state:payload }).select('updated_at').maybeSingle();
        if(!error && data){ stamp(user.id, data.updated_at); if(mergedIn && typeof render==='function') render(); return; }
        if(error && error.code!=='23505') throw error;      // 23505 = row already exists → fall to merge path
      }
      const remote = await pull();                          // conflict → pull current, merge, retry
      if(remote){ store.importState(mergeState(store.exportLocal(), remote.state)); base=remote.updated_at; mergedIn=true; }
      else base=null;
    }
    throw new Error('sync: could not converge');            // stay dirty; retry on next trigger
  }
  function schedulePush(){ if(!user) return; markDirty();          // record locally even if not yet reconciled
    if(!ready) return;                                             // no cloud writes until reconcile succeeded
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>syncPush().catch(e=>console.error('push',e)), 1200); }

  // Reconcile on sign-in / load. The anonymous→account boundary is a product
  // decision (discard signed-out edits); same-account is a CRDT merge.
  async function reconcile(u){
    const sUser = LS.get(SK.syncedUser, null);
    if(sUser && sUser !== u.id) store.clearLocal();         // leftover from another account → drop it
    const linked = LS.get(SK.syncedUser, null) === u.id;    // already reconciled with THIS account?
    if(!linked){                                            // fresh sign-in on this device
      const remote = await pull();
      if(remote && hasData(remote.state)){                  // returning: cloud wins, anon discarded …
        const r = {...remote.state}; const lt = store.exportLocal(); let keptTheme=false;
        // … except theme is a device/UI pref: keep this device's choice if the
        // account has none (e.g. state saved before theme-sync) or it's older.
        if(lt.theme && (!r.theme || (lt.themeAt||0) > (r.themeAt||0))){ r.theme=lt.theme; r.themeAt=lt.themeAt||0; keptTheme=true; }
        store.importState(r); stamp(u.id, remote.updated_at);
        if(keptTheme){ try{ await syncPush(); }catch(e){} }  // propagate the preserved theme up so other devices get it
      }
      else { await syncPush(); }                            // new/empty account: seed from local trial progress
      return;
    }
    await syncPush();                                       // same account → merge remote + local, write back
  }

  // Pull the current remote and MERGE it into local (keeps un-pushed local edits).
  // Used as a safety-net baseline on focus / tab-visible.
  async function pullMerge(){
    if(!user || !ready) return;
    let remote; try{ remote=await pull(); }catch(e){ return; }
    if(!remote) return;
    const before=JSON.stringify(store.exportLocal());
    store.importState(mergeState(store.exportLocal(), remote.state));
    LS.set(SK.syncedAt, remote.updated_at); lastSig=curLastSig();
    if(JSON.stringify(store.exportLocal())!==before && typeof render==='function') render();
  }
  // Live push: another device wrote → merge the new row in immediately.
  function onRealtime(payload){
    const row=payload && payload.new; if(!row || !row.state) return;
    if(row.updated_at === LS.get(SK.syncedAt,null)) return;   // our own echo / already have it
    const before=JSON.stringify(store.exportLocal());
    store.importState(mergeState(store.exportLocal(), row.state));
    LS.set(SK.syncedAt, row.updated_at); lastSig=curLastSig();
    if(JSON.stringify(store.exportLocal())!==before && typeof render==='function') render();
  }
  function subscribeRealtime(){
    if(rtChannel || !sb || !user) return;
    rtChannel = sb.channel('user_state:'+user.id)
      .on('postgres_changes', { event:'*', schema:'public', table:'user_state', filter:'user_id=eq.'+user.id }, onRealtime)
      .subscribe();
  }
  function unsubscribeRealtime(){ if(rtChannel && sb){ try{ sb.removeChannel(rtChannel); }catch(e){} } rtChannel=null; }

  async function onSignIn(u){
    user=u; ready=false; profileName=null;
    try{ await reconcile(u); ready=true; subscribeRealtime(); }  // live updates once reconciled
    catch(e){ console.error('sync',e); }                   // on failure: stay un-ready; retry on next load
    if(typeof render==='function') render();                // reflect reconciled state (derived username as fallback)
    if(typeof refreshAccountMenu==='function') refreshAccountMenu();
    ensureProfile().then(()=>{ if(typeof render==='function') render(); if(typeof refreshAccountMenu==='function') refreshAccountMenu(); })
                   .catch(e=>console.error('profile',e));   // load/assign the real username, then refresh
  }
  function onSignOut(){ unsubscribeRealtime(); user=null; ready=false; profileName=null; clearTimeout(pushTimer);
    store.clearLocal(); clearSync();                        // blank slate — no data leaks past sign-out
    if(typeof render==='function') render();
    if(typeof refreshAccountMenu==='function') refreshAccountMenu(); }

  return {
    enabled, cfg,
    get user(){ return user; },
    get username(){ return displayName(); },   // stored name once loaded, or cached across reloads; null until known (never guessed)
    get initial(){ const n = displayName(); if(n) return n[0].toUpperCase();
      return (user && user.email) ? user.email[0].toUpperCase() : null; },   // email initial while the name loads (never a guess)
    setUsername,
    async getClient(){ return client(); },   // lazily-created supabase client (anon when signed out); used by feedback
    async init(){
      if(!enabled) return;
      store.subscribe(schedulePush);
      // cross-tab coordination (D): mirror another tab's localStorage writes into this tab
      let stoTimer=null;
      addEventListener('storage', e=>{ if(!e.key || e.key.indexOf('slc_')!==0) return;
        clearTimeout(stoTimer); stoTimer=setTimeout(()=>{ store.reload();
          if(user && cachedName() && cachedName()!==profileName) profileName=cachedName();   // another tab renamed
          if(typeof render==='function') render(); if(typeof refreshAccountMenu==='function') refreshAccountMenu(); }, 60); });
      const c=await client();
      const { data:{ session } } = await c.auth.getSession();
      if(session) await onSignIn(session.user);
      c.auth.onAuthStateChange((evt, sess)=>{
        if(sess && sess.user){ if(!user) onSignIn(sess.user); }
        else if(evt==='SIGNED_OUT' && user){ onSignOut(); }   // only on a real sign-out — NOT the no-session INITIAL_SESSION on boot
      });
      addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='hidden'){ // leaving: flush real edits / a moved resume pointer
          if(user && ready && (isDirty() || curLastSig()!==lastSig)) syncPush().catch(()=>{});
        } else { pullMerge(); refreshProfile(); }  // returning: catch up on state + a renamed username
      });
      addEventListener('focus', ()=>{ pullMerge(); refreshProfile(); });
    },
    async signInEmail(email){ const c=await client();
      return c.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+location.pathname } }); },
    async signInGoogle(){ const c=await client();
      return c.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin+location.pathname } }); },
    async signOut(){ const c=await client(); await c.auth.signOut(); onSignOut(); },
  };
})();

/* ==========================================================================
   DATA LAYER — fetched static JSON produced by `str-lc build-site`.
   • index.json      : compact metadata for every problem (search, list rows)
   • collections.json: curated patterns, tracks, companies (+ problem numbers)
   • problems/<n>.json: full parsed problem, lazy-loaded when a reader opens.

const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const META = new Map();        // number -> {n,s,t,d,g}
const metaBySlug = new Map();  // slug -> number

const colBySlug = { pattern:{}, track:{}, company:{} };

async function loadData(){
  const [idx, col] = await Promise.all([
    fetch('data/index.json').then(r=>r.json()),
    fetch('data/collections.json').then(r=>r.json()),
  ]);
  idx.forEach(m=>{ META.set(m.n, m); metaBySlug.set(m.s, m.n); });
  const sc=document.querySelector('#searchBtn > span:not(.kbd)');
  if(sc) sc.textContent=`Search ${META.size.toLocaleString()} problems`;

  PATTERNS.forEach(c=>colBySlug.pattern[c.slug]=c);

}
async function getProblem(n){

  if(p){ problemCache.set(n,p);
    if(problemCache.size>300) problemCache.delete(problemCache.keys().next().value); }  // cap memory (LRU-ish)
  return p;
}
const numToSlug = n => (META.get(Number(n))||{}).s;
const slugToNum = s => metaBySlug.get(s);
const metaOf    = n => META.get(Number(n));
const titleOf   = n => (META.get(Number(n))||{}).t || ('Problem '+n);
const diffOf    = n => (META.get(Number(n))||{}).d || 'Medium';

/* ---------- markdown ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* ---------- lightweight syntax highlighter (Python-first, generic fallback) ---------- */
const HL_KW=new Set(('def return if elif else for while in not and or is class import from as with try except finally raise pass '
 +'break continue lambda yield global nonlocal assert del await async match case function const let var new typeof instanceof of '
 +'switch do throw catch extends super export '
 +'SELECT FROM WHERE GROUP ORDER BY HAVING JOIN LEFT RIGHT INNER OUTER FULL ON UNION ALL INSERT UPDATE DELETE INTO VALUES SET CREATE '
 +'TABLE DISTINCT LIMIT OFFSET AS IS IN CASE WHEN THEN ELSE END BETWEEN LIKE DESC ASC WITH OVER PARTITION').split(' '));
const HL_CONST=new Set('True False None true false null undefined NaN Infinity'.split(' '));
const HL_BUILTIN=new Set(('print len range enumerate map filter sorted sum min max abs int str list dict set tuple zip reversed '
 +'isinstance type float bool input open format round any all ord chr bin hex oct divmod pow id hash iter next slice frozenset bytes '
 +'bytearray property staticmethod classmethod repr getattr setattr hasattr delattr vars dir callable collections deque defaultdict '
 +'heapq bisect math Counter OrderedDict').split(' '));
const HL_RE=/("""[\s\S]*?"""|'''[\s\S]*?''')|(#[^\n]*|\/\/[^\n]*|--[^\n]*|\/\*[\s\S]*?\*\/)|([rRbBfFuU]{0,2}(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`))|(@[A-Za-z_]\w*)|(0[xX][0-9a-fA-F]+|\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/g;
function hl(code){
  let out='', last=0, m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(code))){
    if(m.index>last) out+=esc(code.slice(last,m.index));
    const t=m[0];
    if(m[1]) out+=sp('str',t);
    else if(m[2]) out+=sp('com',t);
    else if(m[3]) out+=sp('str',t);
    else if(m[4]) out+=sp('num',t);     // decorator → amber family
    else if(m[5]) out+=sp('num',t);
    else if(m[6]){ const w=t;
      const defName=/(?:def|class)\s+$/.test(code.slice(Math.max(0,m.index-12),m.index));
      const isCall=/^\s*\(/.test(code.slice(m.index+w.length));
      if(defName) out+=sp('fn',w);
      else if(HL_KW.has(w)) out+=sp('kw',w);
      else if(HL_CONST.has(w)) out+=sp('const',w);
      else if(w==='self'||w==='cls') out+=sp('self',w);
      else if(HL_BUILTIN.has(w)) out+=sp('builtin',w);
      else if(isCall) out+=sp('fn',w);
      else out+=esc(w);
    }
    last=HL_RE.lastIndex;
  }
  if(last<code.length) out+=esc(code.slice(last));
  return out;
}
function sp(c,t){return `<span class="tk-${c}">${esc(t)}</span>`;}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(mm,txt,href)=>{
    href=href.trim();
    // only allow safe schemes/relative links; block javascript:, data:, etc.
    if(!/^(https?:|mailto:|#|\/)/i.test(href)) return txt;
    return `<a href="${href.replace(/"/g,'%22')}" target="_blank" rel="noopener">${txt}</a>`;
  });
  return s;
}
function md(src){
  src=(src||'').replace(/\r/g,'');
  const blocks=[];
  src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>{blocks.push({code:c.replace(/\n+$/,''),lang:(l||'').toLowerCase()});return `\u0000${blocks.length-1}\u0000`;});
  const lines=src.split('\n'); let out=''; let para=[]; let inList=false;
  const fp=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[];}};
  const cl=()=>{if(inList){out+='</ul>';inList=false;}};
  for(let ln of lines){
    let cb=ln.match(/^\u0000(\d+)\u0000$/);
    if(cb){fp();cl();const bl=blocks[+cb[1]];
      const body=(bl.lang==='plaintext'||bl.lang==='text'||bl.lang==='markdown')?esc(bl.code):hl(bl.code);
      out+=`<pre class="code" data-lang="${bl.lang||''}"><code>${body}</code></pre>`;continue;}
    if(!ln.trim()){fp();cl();continue;}
    let h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){fp();cl();const d=Math.min(h[1].length+3,6);out+=`<h4>`+inline(h[2])+`</h4>`;continue;}
    let li=ln.match(/^\s*[-*]\s+(.*)$/);
    if(li){fp();if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(li[1])+'</li>';continue;}
    let bq=ln.match(/^>\s?(.*)$/);
    if(bq){fp();cl();out+='<blockquote>'+inline(bq[1])+'</blockquote>';continue;}
    cl();para.push(ln.trim());
  }
  fp();cl();return out;
}

// a titled tile grid that shows up to `cap` tiles, plus a "+N more" tile to expand
function homeSection(title, tiles, cap){
  if(tiles.length<=cap) return `<div class="section"><div class="eyebrow">${title}</div><div class="grid">${tiles.join('')}</div></div>`;

function collectionView(kind, slug){

  const nums=c.problems; const d=store.countDone(nums); const pct=nums.length?Math.round(d/nums.length*100):0;

    <div id="rowsMore"></div>
  </div></div>`;

// progressive rendering so 700–3,800-row lists stay snappy
function paintRows(nums, opts){
  opts=opts||{}; let i=0; const plist=document.getElementById('plist'); const more=document.getElementById('rowsMore');
  const step=()=>{ const slice=nums.slice(i,i+ROWS_CHUNK);
    plist.insertAdjacentHTML('beforeend', slice.map(n=>row(n,opts)).join(''));
    bindRows(plist); i+=slice.length;
    if(i<nums.length){ more.innerHTML=`<button class="btn ghost" id="moreRows">Show more (${nums.length-i} left)</button>`;
      document.getElementById('moreRows').onclick=step; }
    else more.innerHTML=''; };
  plist.innerHTML=''; step();
}
function row(n, opts){ opts=opts||{}; const m=metaOf(n); if(!m) return '';
  const rm = opts.remove ? `<button class="row-x" data-remove="${opts.remove}:${n}" title="Remove from list" aria-label="Remove from list">${I.x}</button>` : '';
  return `<div class="prow" data-row="${n}"><span class="num">${n}</span><span class="dot ${m.d}"></span>
    <span class="ti">${esc(m.t)}</span>${statusBtn(n)}${rm}<span class="dlabel ${m.d}">${m.d}</span></div>`;
}
function bindRows(scope){
  scope.querySelectorAll('[data-row]:not([data-bound])').forEach(el=>{ el.setAttribute('data-bound','1');
    el.onclick=()=>{ const base=location.hash.replace(/\/+$/,'')||'#'; go((base==='#'?'#':base)+'/'+numToSlug(el.dataset.row)); }; });
  scope.querySelectorAll('[data-status]:not([data-sbound])').forEach(el=>{ el.setAttribute('data-sbound','1');
    el.onclick=e=>{ e.stopPropagation(); openStatusMenu(+el.dataset.status, el, render); }; });
  scope.querySelectorAll('[data-remove]:not([data-rbound])').forEach(el=>{ el.setAttribute('data-rbound','1');
    el.onclick=e=>{ e.stopPropagation(); const [id,n]=el.dataset.remove.split(':'); store.toggleInList(id,+n); render(); }; });
  enhanceA11y(scope);
}

/* ---------- READER (lazy-loads the problem JSON) ---------- */
let readerToken=0;
async function reader(num, ctx){
  num=Number(num); const m=metaOf(num); if(!m){ go('#/'); return; }
  onReader(true); closeStatusMenu();
  const pos = ctx ? ctx.list.indexOf(num) : -1;
  const crumb = ctx ? `<span class="ctx">${esc(ctx.label)}</span><span class="pos">${pos+1}/${ctx.list.length}</span>` : `<span class="ctx">All problems</span>`;
  store.setLast({number:num, kind:ctx?ctx.kind:null, key:ctx?ctx.key:null, label:ctx?ctx.label:null, hash:ctx?ctx.hashFor(num):`#/p/${numToSlug(num)}`});
  LS.set(WELCOME_KEY,true);   // opening any problem retires the first-run welcome
  const token=++readerToken;
  // render the bar + a loading body immediately (title known from the index)
  const bar=document.createElement('div'); bar.className='reader-bar';
  bar.innerHTML=`<a class="rb crumb-back" data-go="${ctx?ctx.parentHash:'#/'}">${I.back}<span class="crumb">${crumb}</span></a>
     <div class="rbar-title"><span class="rbar-num">${num}</span>${esc(m.t)}</div>`;
  const sc=document.createElement('div'); sc.className='reader-scroll';
  sc.innerHTML=`<div class="read-progress"><i></i></div><div class="reader"><div class="rloading">${I.cards} Loading…</div></div>`;
  vp.innerHTML=''; vp.appendChild(bar); vp.appendChild(sc); bind();

  const p=await getProblem(num);
  if(token!==readerToken) return;                       // superseded by a newer navigation
  const readerEl=sc.querySelector('.reader');
  if(!p){ readerEl.innerHTML=`<div class="rloading">Couldn't load this problem.</div>`; return; }

  let secHtml='';
  p.order.forEach(key=>{
    if(key==='Tags'||key==='Similar Problems'||key==='Flashcard') return; // flashcard now lives in the floating hint
    const b=p.sections[key]||''; const short=key.replace(/\s*\(.*\)/,'');
    const id='s-'+short.toLowerCase().replace(/[^a-z]+/g,'-');
    if(key==='Solution'){
      secHtml+=`<div class="sec" id="${id}"><h3>${I.bolt} Solution</h3>
        <div class="spoiler" data-spoiler><div class="lab">Try it yourself first — then reveal the solution.</div>
        <button class="btn">${I.bolt} Reveal solution</button></div>
        <div class="prose hidden" data-sol>${md(b)}</div></div>`;
    } else if(key==='Examples'){
      secHtml+=`<div class="sec" id="${id}"><h3>${short}</h3><div class="ex prose compact">${md(b)}</div></div>`;
    } else {
      secHtml+=`<div class="sec" id="${id}"><h3>${short}</h3><div class="prose compact">${md(b)}</div></div>`;
    }
  });
  const flash=p.sections['Flashcard']||'';
  const hint=flash?`<div class="hint"><button class="hint-toggle" data-hint>${I.bulb}<span>Need a hint?</span></button>
     <div class="hint-body hidden"><div class="fl">Flashcard · key idea</div><p>${inline(flash)}</p></div></div>`:'';
  const tagStr=p.sections['Tags']||'';
  const tags=[...tagStr.matchAll(/([A-Za-z0-9 \-/]+)\(#([a-z0-9-]+)\)/g)].map(mm=>`<span class="chip">${esc(mm[1].trim())}</span>`).join('');
  const simStr=p.sections['Similar Problems']||'';
  const sims=[...simStr.matchAll(/-\s*(.+?)\(([a-z0-9-]+)\)\s*\((Easy|Medium|Hard)\)/g)].map(mm=>{
    const title=mm[1].trim(), slug=mm[2], diff=mm[3];
    return slugToNum(slug)!=null
      ? `<button class="chip" data-go="#/p/${slug}"><span class="dot ${diff}"></span>${esc(title)}</button>`
      : `<span class="chip"><span class="dot ${diff}" style="opacity:.5"></span>${esc(title)}</span>`;
  }).join('');
  const sm=statusMeta(store.getStatus(num));
  const statusPill=`<button class="r-action status-act ${sm.cls}" id="statusPill" data-num="${num}" aria-haspopup="menu" aria-expanded="false">${sm.icon}<span>${sm.key?sm.label:'Set status'}</span><span class="act-chev">${I.chev}</span></button>`;
  const listChip=listChipHTML(num);
  const navBtns=ctx?`<div class="rnav">
    ${navBtn('prev',pos>0?ctx.list[pos-1]:null,pos>0?ctx.hashFor(ctx.list[pos-1]):null)}
    ${navBtn('next',pos<ctx.list.length-1?ctx.list[pos+1]:null,pos<ctx.list.length-1?ctx.hashFor(ctx.list[pos+1]):null)}</div>`:'';
  readerEl.innerHTML=`${hint}
     <span class="r-diff ${p.difficulty}"><span class="dot ${p.difficulty}"></span>${p.difficulty}</span>
     <h1 class="r-title">${p.number} · ${esc(p.title)}</h1>
     <div class="r-meta">${tags}${statusPill}${listChip}<a class="r-action practice-act" href="${p.practice}" target="_blank" rel="noopener"><span>Practice</span>${I.ext}</a></div>
     <div class="hr"></div>${secHtml}
     ${sims?`<div class="sec"><h3>Similar problems</h3><div class="r-meta">${sims}</div></div>`:''}
     ${navBtns}
     <div class="r-report"><button class="r-report-link" data-feedback="content">${I.chat} Report an issue with this problem</button></div>`;
  bind();
  setupReaderScroll(sc);
}
/* reading-progress line + reveal the ribbon title once the page heading scrolls away */
function setupReaderScroll(sc){
  const prog=sc.querySelector('.read-progress i');

  const onScroll=()=>{ const max=sc.scrollHeight-sc.clientHeight;
    prog.style.width=(max>0?Math.min(100,sc.scrollTop/max*100):0)+'%';
    if(h1&&barTitle){ const hidden = h1.getBoundingClientRect().bottom <= sc.getBoundingClientRect().top + 6;
      barTitle.classList.toggle('show', hidden); } };

function navBtn(dir,num,hash){
