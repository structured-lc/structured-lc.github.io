/* ---------- tiny modal (name / confirm) ---------- */
function modal({title,message,input,value,placeholder,okLabel,danger}){
  return new Promise(res=>{
    closeStatusMenu();
    const prevFocus=document.activeElement;
    const ov=document.createElement('div'); ov.className='overlay open modal-ov';
    const esch=s=>esc(s||'');   // dialog text is injected as HTML — escape it
    ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"${title?' aria-label="'+esch(title).replace(/"/g,'&quot;')+'"':''}>
      ${title?`<div class="dlg-title">${esch(title)}</div>`:''}
      ${message?`<div class="dlg-msg">${esch(message)}</div>`:''}
      ${input?`<input class="dlg-input" maxlength="60" placeholder="${(placeholder||'').replace(/"/g,'&quot;')}" value="${(value||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">`:''}
      <div class="dlg-actions"><button class="btn ghost" data-x>Cancel</button>
        <button class="btn ${danger?'btn-danger':''}" data-ok>${esch(okLabel||'OK')}</button></div></div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('.dlg-input'); if(inp){ inp.focus(); inp.select(); }
    else ov.querySelector('[data-ok]').focus();
    const done=v=>{ ov.remove(); document.removeEventListener('keydown',key,true);
      if(prevFocus && prevFocus.focus) try{ prevFocus.focus(); }catch(e){}
      res(v); };
    const ok=()=>done(input ? (inp.value.trim()||null) : true);
    ov.querySelector('[data-ok]').onclick=ok;
    ov.querySelector('[data-x]').onclick=()=>done(null);
    ov.onclick=e=>{ if(e.target===ov) done(null); };
    const key=e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); ok(); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(null); }
      else if(e.key==='Tab'){                       // trap focus inside the dialog
        const f=[...ov.querySelectorAll('button,input,[tabindex]')].filter(el=>!el.disabled);
        if(f.length){ const first=f[0], last=f[f.length-1];
          if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } } } };
    document.addEventListener('keydown',key,true);
  });
}

/* ---------- STUDY ---------- */
/* Deck = problems you marked Done or Revisit, most-recent first (reinforce what
   you just learned). Falls back to all flashcards until you've marked any. */
let sIdx=0, sFlip=false, studyToken=0;
async function study(){
  onReader(false); setActiveNav('study'); exitZen();
  const review=store.reviewQueue();
  const fallback=review.length===0;
  const deck=fallback?[...META.keys()]:review;
  sIdx=((sIdx%deck.length)+deck.length)%deck.length;
  const n=deck[sIdx]; const m=metaOf(n); const st=store.getStatus(n);
  const badge = st ? `<span class="deck-badge ${st}">${statusMeta(st).label}</span>` : '';
  const token=++studyToken;
  vp.innerHTML=`<div class="scroll"><div class="study-wrap">
    <a class="back" data-go="#/">${I.back} Home</a>
    <div class="eyebrow" style="margin-top:8px;justify-content:center">${fallback?'All flashcards':'Your review deck'}</div>
    ${fallback?`<div class="study-note">You haven’t marked any problems yet — showing all flashcards. Mark problems <b>Done</b> or <b>Revisit</b> and they’ll appear here, newest first.</div>`:''}
    <div class="card3d"><div class="card-inner ${sFlip?'flip':''}" id="flip">
      <div class="face front">${badge}<div class="k">${n} · ${m.d}</div><div class="q">${esc(m.t)}</div><div class="study-hint">tap to reveal the idea</div></div>
      <div class="face back"><div class="k">Key idea</div><div class="a" id="flipBack">…</div></div>
    </div></div>
    <div class="study-nav"><button class="btn ghost" id="sPrev" aria-label="Previous card">${I.back}</button>
      <span class="ct">${sIdx+1} / ${deck.length}</span><button class="btn ghost" id="sNext">Next ${I.arrow}</button></div>
    <div class="study-hint">Space / tap to flip · ← → to move · <a data-go="#/p/${numToSlug(n)}">open problem</a></div>
  </div></div>`;
  document.getElementById('flip').onclick=()=>{sFlip=!sFlip;document.getElementById('flip').classList.toggle('flip');};
  document.getElementById('sPrev').onclick=()=>{sIdx--;sFlip=false;study();};
  document.getElementById('sNext').onclick=()=>{sIdx++;sFlip=false;study();};
  bind();
  const p=await getProblem(n); if(token!==studyToken) return;
  const back=document.getElementById('flipBack'); if(back) back.innerHTML=inline((p&&p.sections['Flashcard'])||'No flashcard for this problem.');
}

/* ---------- search ---------- */
const overlay=document.getElementById('overlay'), sInput=document.getElementById('searchInput'), sRes=document.getElementById('searchResults');
let selIdx=0, curResults=[], addMode=null;   // addMode = list id when picking problems to add
function openSearch(listId){ addMode=(typeof listId==='string')?listId:null;
  overlay.classList.toggle('add-mode',!!addMode); overlay.classList.add('open');
  const l=addMode?store.getList(addMode):null;
  sInput.placeholder = l?`Add to “${l.name}” — search ${META.size} problems…`:'Search problems, patterns, tracks, lists…';
  sInput.value=''; renderSearch(''); sInput.focus(); }
function closeSearch(){ const wasAdd=addMode; overlay.classList.remove('open'); addMode=null; if(wasAdd) render(); }
function pickResult(i){ const r=curResults[i]; if(!r) return;
  if(addMode){ store.toggleInList(addMode,r.num); renderSearch(sInput.value); return; }
  closeSearch();
  if(r.type==='problem') go(`#/p/${numToSlug(r.num)}`);
  else if(r.type==='collection') go(`#/${r.kind}/${r.slug}`);
  else if(r.type==='list') go(`#/list/${slugify(r.title)||r.id}`);
}
function renderSearch(q){
  q=q.trim().toLowerCase();
  const matchName=s=>!q||s.toLowerCase().includes(q);
  const probMatch=m=>(''+m.n).includes(q)||m.t.toLowerCase().includes(q);
  let groups=[];
  if(addMode){
    const probs=(q?[...META.values()].filter(probMatch):[...META.values()]).slice(0,60);
    curResults=probs.map(m=>({type:'problem',num:m.n,title:m.t,diff:m.d}));
    groups=[{label:null,from:0,to:curResults.length}];
  } else {
    const cols=[];
    PATTERNS.forEach(c=>{ if(matchName(c.name)) cols.push({type:'collection',kind:'pattern',slug:c.slug,title:c.name,sub:`Pattern · ${c.count}`}); });
    TRACKS.forEach(c=>{ if(matchName(c.name)) cols.push({type:'collection',kind:'track',slug:c.slug,title:c.name,sub:`Track · ${c.count}`}); });
    COMPANIES.forEach(c=>{ if(matchName(c.name)) cols.push({type:'collection',kind:'company',slug:c.slug,title:c.name,sub:`Company · ${c.count}`}); });
    store.getLists().forEach(l=>{ if(matchName(l.name)) cols.push({type:'list',id:l.id,title:l.name,sub:`Your list · ${l.problems.length}`}); });
    const probs=(q?[...META.values()].filter(probMatch):[]).slice(0,50).map(m=>({type:'problem',num:m.n,title:m.t,diff:m.d}));
    curResults=[...cols.slice(0,14),...probs];
    groups=[{label:'Collections',from:0,to:Math.min(cols.length,14)},{label:'Problems',from:Math.min(cols.length,14),to:curResults.length}];
  }
  if(selIdx>=curResults.length) selIdx=0;
  if(!curResults.length){ sRes.innerHTML=`<div class="empty">No matches.</div>`; return; }
  let html='';
  groups.forEach(g=>{ if(g.to<=g.from) return;
    if(g.label) html+=`<div class="res-group">${g.label}</div>`;
    for(let i=g.from;i<g.to;i++){ const r=curResults[i];
      if(r.type==='problem'){ const added=addMode&&store.inList(addMode,r.num);
        const right=addMode?`<span class="addmark ${added?'on':''}">${added?I.check:I.plus}</span>`:`<span class="dlabel ${r.diff}">${r.diff}</span>`;
        html+=`<div class="res ${i===selIdx?'sel':''} ${added?'added':''}" data-i="${i}">
          <span class="num">${r.num}</span><span class="dot ${r.diff}"></span><span class="ti">${esc(r.title)}</span>${right}</div>`;
      } else {
        const ic = r.type==='list'?I.bookmark : r.kind==='pattern'?'#' : r.kind==='company'?I.building : I.path;
        html+=`<div class="res ${i===selIdx?'sel':''}" data-i="${i}">
          <span class="res-ic">${ic}</span><span class="ti">${esc(r.title)}</span><span class="res-sub">${esc(r.sub)}</span></div>`;
      }
    }
  });
  sRes.innerHTML=html;
  sRes.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pickResult(+el.dataset.i));
}
sInput.oninput=e=>renderSearch(e.target.value);

/* ---------- zen / theme ---------- */
function toggleZen(){document.body.classList.toggle('zen');}
function exitZen(){document.body.classList.remove('zen');}
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t);
  // keep the browser UI (status bar / address bar) in sync with the forced theme
  let tc=document.querySelector('meta[name="theme-color"]:not([media])');
  if(!tc){ tc=document.createElement('meta'); tc.name='theme-color'; document.head.appendChild(tc); }
  tc.setAttribute('content', t==='dark'?'#17150F':'#FAF7F0'); }
function toggleTheme(){ const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; applyTheme(t); store.setTheme(t); }
{ const t=store.getTheme(); if(t) applyTheme(t); }

/* ---------- delegated events ---------- */
// Make non-native interactive elements keyboard-operable: real links get an href
// (focusable + Enter), clickable <div>s get a button role + tab stop (activated by
// the global Enter/Space handler below).
function enhanceA11y(scope){
  scope.querySelectorAll('a[data-go]:not([href])').forEach(a=>a.setAttribute('href',a.getAttribute('data-go')));
  scope.querySelectorAll('[data-go]:not(a),[data-row],[data-expand],[data-newlist],#studyGo').forEach(el=>{
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  });
}
document.addEventListener('keydown',e=>{      // activate role=button divs with Enter / Space
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target; if(!(t instanceof Element)) return;
  if(t.matches('a[href],button,input,textarea,select,[contenteditable]')) return;   // native already handles these
  const el=t.closest('[tabindex="0"][data-go],[tabindex="0"][data-row],[tabindex="0"][data-expand],[tabindex="0"][data-newlist],#studyGo[tabindex="0"]');
  if(el){ e.preventDefault(); el.click(); }
});
function bind(){
  vp.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{ e.preventDefault(); go(el.getAttribute('data-go')); });
  const pill=document.getElementById('statusPill'); if(pill) pill.onclick=e=>{ e.stopPropagation(); openStatusMenu(+pill.dataset.num, pill, ()=>updatePill(+pill.dataset.num)); };
  bindListChip();
  vp.querySelectorAll('[data-expand]').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    const sec=b.closest('.section'); const exp=sec.classList.toggle('expanded');
    const n=sec.querySelectorAll('.tile.overflow').length;
    b.querySelector('.more-label').textContent = exp ? 'Show less' : `+${n} more`; });
  const sg=document.getElementById('studyGo'); if(sg) sg.onclick=()=>go('#/study');
  const wx=document.getElementById('welcomeX'); if(wx) wx.onclick=()=>{ LS.set(WELCOME_KEY,true);
    const w=document.getElementById('welcome'); if(w) w.remove(); };
  const ws=document.getElementById('welcomeStart'); if(ws) ws.onclick=()=>{ LS.set(WELCOME_KEY,true); go(ws.dataset.start); };
  vp.querySelectorAll('[data-spoiler]').forEach(sp=>sp.querySelector('button').onclick=()=>{ sp.classList.add('hidden'); sp.nextElementSibling.classList.remove('hidden'); });
  vp.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{
    const body=b.nextElementSibling; const open=body.classList.toggle('hidden')===false;
    b.querySelector('span').textContent = open ? 'Hide hint' : 'Need a hint?'; });
  // custom-list management
  vp.querySelectorAll('[data-newlist]').forEach(el=>el.onclick=async()=>{
    const name=await modal({title:'New list',input:true,placeholder:'e.g. Revisit before interview',okLabel:'Create'});
    if(name){ const id=store.createList(name); go(`#/list/${listSlug(store.getList(id))}`); } });
  vp.querySelectorAll('[data-addproblems]').forEach(el=>el.onclick=()=>openSearch(el.dataset.addproblems));
  vp.querySelectorAll('[data-rename]').forEach(el=>el.onclick=async()=>{
    const l=store.getList(el.dataset.rename);
    const name=await modal({title:'Rename list',input:true,value:l?.name,okLabel:'Save'});
    if(name){ store.renameList(el.dataset.rename,name); render(); } });
  vp.querySelectorAll('[data-deletelist]').forEach(el=>el.onclick=async()=>{
    const l=store.getList(el.dataset.deletelist);
    const ok=await modal({title:'Delete list?',message:`“${l?.name}” and its ${l?.problems.length||0} saved problem(s) will be removed. Your progress on those problems is kept.`,okLabel:'Delete',danger:true});
    if(ok){ store.deleteList(el.dataset.deletelist); go('#/'); } });
  vp.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const [id,n]=el.dataset.remove.split(':'); store.toggleInList(id,+n); render(); });
  vp.querySelectorAll('[data-feedback]').forEach(el=>el.onclick=()=>openFeedback(el.dataset.feedback));
  enhanceA11y(vp);
}

/* ---------- feedback ---------- */
const FB_TYPES=[
  {k:'design', label:'🎨 Design & UX'}, {k:'feature', label:'✨ Feature idea'},
  {k:'bug', label:'🐛 Bug'}, {k:'content', label:'📝 Content fix'}, {k:'other', label:'💬 Other'},
];
let fbLastSent=0, toastTimer=null;
function toast(msg, err){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
  t.textContent=msg; t.classList.toggle('err',!!err);
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 3400);
}
// what page is the user on? (auto-attached context)
function feedbackContext(){
  const hash=location.hash||'#/';
  const parts=hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const ctx={ hash, view:'home' };
  const setP=seg=>{ const n=resolveId(seg); const m=(n!=null)&&metaOf(n); if(m){ ctx.problemNumber=m.n; ctx.slug=m.s; ctx.title=m.t; ctx.difficulty=m.d; } };
  if(parts[0]==='study') ctx.view='study';
  else if(parts[0]==='p'){ ctx.view='reader'; setP(parts[1]); }
  else if(parts[0]==='pattern'||parts[0]==='track'||parts[0]==='company'){ ctx.collection=parts[0]+'/'+parts[1];
    if(parts[2]){ ctx.view='reader'; setP(parts[2]); } else ctx.view='collection'; }
  else if(parts[0]==='list'){ ctx.collection='list/'+parts[1];
    if(parts[2]){ ctx.view='reader'; setP(parts[2]); } else ctx.view='list'; }
  return ctx;
}
function feedbackEnv(){ return { appVersion:BUILD, theme:document.documentElement.getAttribute('data-theme')||'light',
  viewport:innerWidth+'×'+innerHeight, ua:navigator.userAgent, lang:navigator.language, ts:new Date().toISOString() }; }

function openFeedback(defaultType){
  closeStatusMenu();
  const page=feedbackContext(); const env=feedbackEnv();
  const prevFocus=document.activeElement; const signedIn=!!auth.user;
  let type=defaultType||null; const incl={ page:true, env:true };
  const pageLabel = esc(page.view)+(page.problemNumber?` · #${page.problemNumber} ${esc(page.title||'')}`:'');
  const ov=document.createElement('div'); ov.className='overlay open modal-ov';
  ov.innerHTML=`<div class="dialog fb-dialog" role="dialog" aria-modal="true" aria-label="Send feedback">
    <div class="dlg-title">Send feedback</div>
    <div class="dlg-msg">Bugs, ideas, a wrong solution — all welcome. ${signedIn?`Sent as <b>${esc(auth.username||'you')}</b>.`:''}</div>
    <div class="fb-types">${FB_TYPES.map(t=>`<button type="button" class="fb-type${type===t.k?' on':''}" data-t="${t.k}">${t.label}</button>`).join('')}</div>
    <textarea class="fb-msg" maxlength="4000" placeholder="Tell us what happened, or what you'd like…"></textarea>
    ${signedIn?'':`<input class="dlg-input fb-email" type="email" maxlength="200" placeholder="Email (optional — so we can reply)" style="margin:12px 0 0">`}
    <div class="fb-ctx-label">Attached</div>
    <div class="fb-ctx">
      <span class="fb-chip" data-k="page"><span class="lab">${pageLabel}</span><button type="button" data-drop="page" title="Don't include" aria-label="Remove page context">${I.x}</button></span>
      <span class="fb-chip" data-k="env"><span class="lab">${esc(BUILD)} · ${esc(env.theme)} · ${esc(env.viewport)}</span><button type="button" data-drop="env" title="Don't include" aria-label="Remove environment">${I.x}</button></span>
    </div>
    <input class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Leave this empty">
    <div class="fb-note">We only send what you see above.${signedIn?'':" Add an email if you'd like a reply."}</div>
    <div class="dlg-actions"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>Send feedback</button></div>
  </div>`;
  document.body.appendChild(ov);
  const dlg=ov.querySelector('.dialog'), msg=ov.querySelector('.fb-msg'), okBtn=ov.querySelector('[data-ok]');
  msg.focus();
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',key,true); if(prevFocus&&prevFocus.focus)try{prevFocus.focus();}catch(e){} };
  ov.querySelectorAll('.fb-type').forEach(b=>b.onclick=()=>{ type=b.dataset.t;
    ov.querySelectorAll('.fb-type').forEach(x=>x.classList.toggle('on',x===b)); });
  ov.querySelector('.fb-ctx').onclick=e=>{ const d=e.target.closest('[data-drop]'); if(!d)return;
    incl[d.dataset.drop]=false; d.closest('.fb-chip').remove(); };
  ov.querySelector('[data-x]').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  const submit=async()=>{
    const message=msg.value.trim();
    if(!type){ toast('Pick a type first', true); return; }
    if(message.length<5){ toast('Add a little more detail', true); msg.focus(); return; }
    if(ov.querySelector('.fb-hp').value){ close(); return; }                 // honeypot → silently drop
    if(Date.now()-fbLastSent<20000){ toast('Hang on a moment before sending again', true); return; }
    const emailEl=ov.querySelector('.fb-email'); const email=emailEl?emailEl.value.trim():'';
    okBtn.disabled=true; okBtn.textContent='Sending…';
    const fb={ type, message, email:email||null,
      page: incl.page?page:{hash:page.hash,view:page.view}, env: incl.env?env:{appVersion:BUILD} };
    try{ await submitFeedback(fb); fbLastSent=Date.now(); close(); toast('Thanks — your feedback was sent 🙌'); }
    catch(err){ console.error('feedback',err); okBtn.disabled=false; okBtn.textContent='Send feedback'; feedbackFailFallback(fb); }
  };
  okBtn.onclick=submit;
  const key=e=>{
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); }
    else if(e.key==='Tab'){ const f=[...dlg.querySelectorAll('button,input,textarea')].filter(el=>!el.disabled&&el.tabIndex!==-1);
      if(f.length){ const a=f[0], z=f[f.length-1];
        if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); }
        else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); } } }
  };
  document.addEventListener('keydown',key,true);
}
async function submitFeedback(fb){
  if(!auth.enabled) throw new Error('not-configured');          // no Supabase → fallback copies to clipboard
  const c=await auth.getClient();
  const row={ type:fb.type, message:fb.message, page:fb.page, env:fb.env };
  if(auth.user){ row.user_id=auth.user.id; row.user_name=auth.username||null; row.reporter_email=fb.email||auth.user.email||null; }
  else if(fb.email){ row.reporter_email=fb.email; }
  const { error }=await c.from('feedback').insert(row);
  if(error) throw error;
}
// last resort (network error, or no Supabase configured): copy so nothing is lost
async function feedbackFailFallback(fb){
  const text=`[Structured-LC feedback]\nType: ${fb.type}\nPage: ${fb.page.hash}\n`+(fb.email?`Email: ${fb.email}\n`:'')+`\n${fb.message}`;
  let copied=false; try{ await navigator.clipboard.writeText(text); copied=true; }catch(e){}
  const mail=(window.SLC_CONFIG||{}).FEEDBACK_EMAIL;
  if(mail) location.href=`mailto:${mail}?subject=${encodeURIComponent('[Structured-LC] '+fb.type)}&body=${encodeURIComponent(text)}`;
  toast(copied?'Couldn’t send — copied to your clipboard so it isn’t lost':'Couldn’t send feedback — please try again', true);
}

/* ---------- router ---------- */
function render(){
  closeStatusMenu();
  { const t=store.getTheme(); if(t) applyTheme(t); }   // keep the DOM in sync with theme (incl. a cloud-synced change)
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!parts.length) return home();
  if(parts[0]==='study') return study();
  if(parts[0]==='pattern'||parts[0]==='track'||parts[0]==='company'){
    const kind=parts[0]; if(!collectionOf(kind,parts[1])) return go('#/');
    return parts[2]?reader(resolveId(parts[2]),ctxCollection(kind,parts[1])):collectionView(kind,parts[1]); }
  if(parts[0]==='list'){ const l=listBySlug(parts[1]); if(!l)return go('#/');
    return parts[2]?reader(resolveId(parts[2]),ctxList(l.id)):customListView(l.id); }
  if(parts[0]==='p') return reader(resolveId(parts[1]),null);
  return home();
}
addEventListener('hashchange',render);

/* tab-bar nav → routes */
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ const n=b.dataset.nav;
  if(n==='study')go('#/study'); else if(n==='search')openSearch(); else if(n==='account')openAccountMenu(document.getElementById('accountBtn')); else go('#/'); });
document.querySelector('.brand').onclick=e=>{ e.preventDefault(); go('#/'); };
document.getElementById('searchBtn').onclick=openSearch;
document.getElementById('feedbackBtn').onclick=()=>openFeedback();
document.getElementById('topTheme').onclick=toggleTheme;
document.getElementById('accountBtn').onclick=e=>{ e.stopPropagation(); openAccountMenu(e.currentTarget); };
overlay.onclick=e=>{ if(e.target===overlay)closeSearch(); };

/* ---------- account menu (Supabase auth, gated by config) ---------- */
let acctAnchor=null;
function accountMenuHTML(){
  const u=auth.user;
  if(u){ const email=u.email||'Signed in';
    return `<div class="acct-head"><div class="acct-av">${esc(auth.initial||'')}</div>
        <div class="acct-id"><div class="acct-name">${esc(auth.username||'')}</div><div class="acct-sub">${esc(email)}</div></div></div>
      <div class="acct-body">
        <button data-edituser>${I.flag}<span>Change username</span></button>
        <button data-signout>${I.user}<span>Sign out</span></button>
      </div>
      <div class="acct-note">Synced across your devices ✓</div>`;
  }
  if(auth.enabled){
    return `<div class="acct-head"><div class="acct-av">${I.user}</div>
        <div><div class="acct-name">Sign in</div><div class="acct-sub">Sync progress & lists across devices</div></div></div>
      <div class="acct-body acct-auth">
        <button class="btn" data-google><span>Continue with Google</span></button>
      </div>
      <div class="acct-note">Your on-device progress merges in on first sign-in.</div>`;
  }
  return `<div class="acct-head"><div class="acct-av">${I.user}</div>
      <div><div class="acct-name">Guest</div><div class="acct-sub">Progress saved on this device</div></div></div>
    <div class="acct-note">Cross-device sync is available — add your Supabase keys in <b>config.js</b> to turn it on. Until then everything is saved locally.</div>`;
}
function wireAccountMenu(m){
  const so=m.querySelector('[data-signout]'); if(so) so.onclick=async ev=>{ ev.stopPropagation(); closeStatusMenu(); await auth.signOut(); render(); };
  const eu=m.querySelector('[data-edituser]'); if(eu) eu.onclick=async ev=>{ ev.stopPropagation(); closeStatusMenu();
    const name=await modal({ title:'Change username', input:true, value:auth.username, placeholder:'2–24 letters, numbers, - or _', okLabel:'Save' });
    if(name && name!==auth.username){ const { error }=await auth.setUsername(name);
      if(error) modal({ title:'Couldn’t save', message:error.message, okLabel:'OK' });
      else { render(); refreshAccountMenu(); } } };
  const gg=m.querySelector('[data-google]'); if(gg) gg.onclick=async ev=>{ ev.stopPropagation(); const { error }=await auth.signInGoogle();
    if(error){ closeStatusMenu(); modal({title:'Google sign-in unavailable',message:error.message,okLabel:'OK'}); } };
}
function refreshAccountMenu(){ // re-render if open; always refresh the avatar
  const av=document.getElementById('accountBtn');
  if(av){ av.innerHTML = auth.user ? `<span class="av-initial">${auth.initial}</span>` : I.user;
    av.classList.toggle('signed-in', !!auth.user); }
  if(openMenuEl && openMenuEl.classList.contains('account-menu') && acctAnchor) openAccountMenu(acctAnchor);
}
function openAccountMenu(anchor){
  acctAnchor=anchor; closeStatusMenu();
  const m=document.createElement('div'); m.className='status-menu account-menu';
  m.innerHTML=accountMenuHTML();
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.max(12,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-12))+'px';
  m.style.top=(r.bottom+8)+'px';
  m.addEventListener('click',e=>e.stopPropagation());   // keep menu open while using the form
  wireAccountMenu(m);
  markMenuOpen(m, anchor);
}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='Escape' && openMenuEl){ const t=openMenuEl._trigger; closeStatusMenu(); if(t&&t.focus)try{t.focus();}catch(_){}; return; }
  if(overlay.classList.contains('open')){
    if(e.key==='Escape')closeSearch();
    if(e.key==='Enter'&&curResults[selIdx])pickResult(selIdx);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
      selIdx=(selIdx+(e.key==='ArrowDown'?1:-1)+curResults.length)%curResults.length;
      sRes.querySelectorAll('.res').forEach((r,i)=>r.classList.toggle('sel',i===selIdx));
      sRes.querySelectorAll('.res')[selIdx]?.scrollIntoView({block:'nearest'});}
    return;
  }
  if(e.target instanceof Element && e.target.matches('input,textarea')) return;   // don't fire shortcuts while typing
  if(document.getElementById('flip')){
    if(e.key===' '){e.preventDefault();document.getElementById('flip').click();}
    if(e.key==='ArrowRight')document.getElementById('sNext').click();
    if(e.key==='ArrowLeft')document.getElementById('sPrev').click();
    return;
  }
  if(e.key==='f'||e.key==='F')toggleZen();   // Focus is global now
  if(document.querySelector('.reader-bar')){
    if(e.key==='ArrowLeft'){const b=document.querySelector('.rnav .prev:not([disabled])');if(b)b.click();}
    if(e.key==='ArrowRight'){const b=document.querySelector('.rnav .next:not([disabled])');if(b)b.click();}
  }
  if(e.key==='Escape')exitZen();
});

loadData().then(render).catch(err=>{

  console.error(err);
});
auth.init().catch(e=>console.error('auth init',e));   // no-op unless config.js has Supabase keys
